    <!-- Book a Session Section -->
    <section class="container py-5">
        <div class="text-center">
            <h1>Book a Session</h1>
            <p class="lead">Join us in one of our programs designed to improve health, education, and community engagement.</p>
        </div>

        <!-- Booking Form -->
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form action="submit-booking.php" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="session" class="form-label">Select Session</label>
                        <select class="form-select" id="session" name="session" required>
                            <option value="youth-program">Youth Program</option>
                            <option value="community-engagement">Community Engagement</option>
                            <option value="sports-education">Sports & Education</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Preferred Date</label>
                        <input type="date" class="form-control" id="date" name="date" required>
                    </div>
                    <button type="submit" class="btn btn-danger btn-lg w-100">Book Now</button>
                </form>
            </div>
        </div>
    </section>
